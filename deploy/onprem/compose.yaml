# Only `tls` publishes a port. `app` and `llm` are reachable on the internal
# network only. Put TRID_HOSTNAME=<server hostname> in a .env file next to this file.
# ./data must be writable by uid 10001 (chown 10001:10001 data).
name: trid-onprem

services:
  llm:
    image: trid-onprem-llm:latest
    restart: unless-stopped
    environment:
      LLM_THREADS: ${LLM_THREADS:-4}
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true

  app:
    image: trid-onprem-app:latest
    restart: unless-stopped
    mem_limit: 1g
    depends_on: [llm]
    volumes:
      - ./data:/data
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

  tls:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on: [app]
    environment:
      TRID_HOSTNAME: ${TRID_HOSTNAME:?set TRID_HOSTNAME in .env}
      TRID_MAX_BODY: ${TRID_MAX_BODY:-3MB}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks: [internal, edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /data
      - /config

networks:
  internal:
    internal: true
  edge: {}
