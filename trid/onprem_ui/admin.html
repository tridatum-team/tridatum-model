<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="TOKEN_PLACEHOLDER">
<title>TRID 관리자</title>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<header class="topbar">
<h1>TRID 관리자</h1>
<a class="btn small" href="/">직원 화면으로</a>
<button id="logout" class="btn small" type="button">로그아웃</button>
</header>
<main class="wide">
<section class="card plain" aria-labelledby="users-title">
<h2 id="users-title">계정</h2>
<div class="table-wrap">
<table>
<thead><tr><th>아이디</th><th>역할</th><th>상태</th><th>작업</th></tr></thead>
<tbody id="users"></tbody>
</table>
</div>
<p id="users-message" class="msg" role="alert"></p>
<h2>계정 만들기</h2>
<form id="create-form" class="filters">
<div><label for="new-username">아이디</label><input id="new-username" type="text" autocomplete="off" required></div>
<div><label for="new-password">임시 비밀번호 (10자 이상)</label><input id="new-password" type="text" autocomplete="off" minlength="10" required></div>
<div><label for="new-role">역할</label><select id="new-role"><option value="user">직원</option><option value="admin">관리자</option></select></div>
<div><button class="btn primary" type="submit">만들기</button></div>
</form>
<p class="notice">새 계정과 초기화된 계정은 첫 로그인 때 비밀번호를 바꿔야 합니다.</p>
</section>

<section class="card plain" aria-labelledby="events-title">
<h2 id="events-title">이용 기록</h2>
<form id="filter-form" class="filters">
<div><label for="f-since">시작일</label><input id="f-since" type="date"></div>
<div><label for="f-until">종료일</label><input id="f-until" type="date"></div>
<div><label for="f-username">계정</label><input id="f-username" type="text" autocomplete="off"></div>
<div><label for="f-event">이벤트</label><select id="f-event"><option value="">전체</option></select></div>
<div class="row"><button class="btn primary" type="submit">조회</button><a id="csv" class="btn" href="/api/admin/events.csv">CSV 내려받기</a></div>
</form>
<p id="events-message" class="msg" role="alert"></p>
<div class="table-wrap">
<table>
<thead><tr><th>시각</th><th>이벤트</th><th>계정</th><th>결과</th><th>IP</th><th>상세</th></tr></thead>
<tbody id="events"></tbody>
</table>
</div>
<div class="row end">
<span id="page-info" class="notice"></span>
<button id="prev" class="btn small" type="button">이전</button>
<button id="next" class="btn small" type="button">다음</button>
</div>
</section>
</main>
<script src="/admin.js"></script>
</body>
</html>
