{% extends "base.html" %}
{% block title %}TRID 로그인{% endblock %}
{% block body %}<main class="login">
<h1>TRID 문서 확인</h1>
<p class="notice">{{ status_text }}</p>
<form id="login" class="card plain" method="post" action="/api/login">
<label for="username">아이디</label>
<input id="username" name="username" type="text" autocomplete="username" required>
<label for="password">비밀번호</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<div class="actions"><button id="submit" class="btn primary" type="submit">로그인</button></div>
</form>
<p id="message" class="msg" role="alert"></p>
</main>{% endblock %}
{% block script %}/static/login.js{% endblock %}
