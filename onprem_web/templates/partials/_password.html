<section id="password-view" class="card plain login-like"{% if not show_password %} hidden{% endif %}>
<h2>비밀번호 변경</h2>
<p class="notice">처음 로그인했거나 비밀번호가 초기화됐습니다. 새 비밀번호(10자 이상)로 바꾼 뒤 이용할 수 있습니다.</p>
<form id="password-form" method="post" action="/ui/password" hx-post="/ui/password" hx-target="#password-view" hx-swap="outerHTML">
<label for="current">현재 비밀번호</label>
<input id="current" name="current" type="password" autocomplete="current-password" required>
<label for="new-password">새 비밀번호</label>
<input id="new-password" name="new" type="password" autocomplete="new-password" minlength="10" required>
<div class="actions"><button class="btn primary" type="submit">비밀번호 변경</button></div>
</form>
<p id="password-message" class="msg{% if error %} error{% endif %}" role="alert">{{ error }}</p>
</section>
